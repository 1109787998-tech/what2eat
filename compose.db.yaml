name: what2eat

services:
  postgres:
    image: postgres:16
    container_name: what2eat-postgres

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - what2eat_pgdata:/var/lib/postgresql/data

volumes:
  what2eat_pgdata:
